services:
  logger.channel.bfep:
    parent: logger.channel_base
    arguments: ['bfep']

  bfep.database:
    class: Drupal\Core\Database\Connection
    factory: ['Drupal\Core\Database\Database', 'getConnection']
    arguments: ['default', 'bfdb']

  bfep.settings:
    class: Drupal\bfep\Service\BfepSettings
    arguments: ['@config.factory']

  bfep.cache_invalidator:
    class: Drupal\bfep\Service\BfepCacheInvalidator
    arguments: ['@cache_tags.invalidator']

  bfep.audit_logger:
    class: Drupal\bfep\Service\AuditLogger
    arguments: ['@logger.channel.bfep', '@current_user']

  bfep.submission_guard:
    class: Drupal\bfep\Service\SubmissionGuard
    arguments: ['@flood', '@request_stack', '@bfep.settings', '@string_translation']

  # The repositories take bfdb as a closure, so building them (for menus, page
  # titles or the search shortcut, on every page) never opens a connection.
  # Only a query does, so a bfdb outage breaks only pages that need its data.
  bfep.campaign_repository:
    class: Drupal\bfep\Repository\CampaignRepository
    arguments:
      - '@>bfep.database'
      - '@cache.default'
      - '@datetime.time'
      - '@bfep.settings'

  bfep.initiative_repository:
    class: Drupal\bfep\Repository\InitiativeRepository
    arguments:
      - '@>bfep.database'
      - '@cache.default'
      - '@datetime.time'
      - '@bfep.settings'

  bfep.campaign_presenter:
    class: Drupal\bfep\Service\CampaignPresenter
    arguments: ['@date.formatter']

  bfep.campaign_list_builder:
    class: Drupal\bfep\Service\CampaignListBuilder
    arguments:
      - '@bfep.campaign_repository'
      - '@bfep.campaign_presenter'
      - '@bfep.settings'

  bfep.seo_manager:
    class: Drupal\bfep\Service\SeoManager
    arguments:
      - '@current_route_match'
      - '@request_stack'
      - '@bfep.campaign_repository'
      - '@bfep.settings'
      - '@logger.channel.bfep'

  bfep.search_shortcut_subscriber:
    class: Drupal\bfep\EventSubscriber\SearchShortcutSubscriber
    arguments:
      - '@current_route_match'
      - '@entity_type.manager'
      - '@current_user'
      - '@bfep.campaign_repository'
      - '@logger.channel.bfep'
    tags:
      - { name: event_subscriber }

  bfep.bfdb_exception_subscriber:
    class: Drupal\bfep\EventSubscriber\BfdbExceptionSubscriber
    arguments: ['@http_kernel', '@logger.channel.bfep']
    tags:
      - { name: event_subscriber }
